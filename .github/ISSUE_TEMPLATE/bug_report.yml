name: Bug report
description: Something in Orbit Maps doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't include your real location, home or work address, or
        search history.** Use a nearby public place or made-up coordinates instead.

        - Security or privacy vulnerability? Report it privately instead:
          https://github.com/orbitmaps-oss/orbitmaps/security/advisories/new
        - Wrong or missing map data (a road, a name, a shop)? Fix it on https://www.openstreetmap.org
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Download the region pack for …
        2. Search for …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orbit Maps version
      placeholder: "0.0.1 (from Settings → About)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you install Orbit Maps from?
      options:
        - F-Droid
        - Google Play
        - GitHub release
        - Built from source
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Check that screenshots and logs don't show your location or other personal data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report does not contain my real location, addresses or search history.
          required: true
